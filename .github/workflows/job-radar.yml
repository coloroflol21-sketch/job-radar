name: Job Radar

on:
  schedule:
    # Каждые 5 минут — минимум, который допускает GitHub.
    # Задержка ответа бота на команды получается в среднем 2,5 минуты.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать вакансии в логе, без отправки в Telegram'
        type: boolean
        default: false

# Состояние живёт в кэше, а не в репозитории: в нём адреса работодателей
# и история откликов, которым не место в публичной истории git.
permissions:
  contents: read

# Параллельные запуски мешали бы друг другу при записи состояния.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Зависимости
        run: npm ci

      # Ключ кэша уникален для каждого запуска, потому что запись по существующему
      # ключу игнорируется. restore-keys подтягивает последнее сохранённое состояние.
      - name: Восстановить состояние
        uses: actions/cache/restore@v4
        with:
          path: state
          key: job-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-radar-state-

      - name: Поиск вакансий и обработка команд
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Нужны только для отправки откликов: без них /apply вернёт понятную ошибку,
          # а поиск вакансий продолжит работать.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # Необязательный: адрес в поле «От кого», если он отличается от SMTP_USER.
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi

      # Сохраняем даже после сбоя предыдущего шага: отклик мог уже уйти,
      # и без записи журнала он отправится повторно при следующем запуске.
      - name: Сохранить состояние
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: state
          key: job-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
