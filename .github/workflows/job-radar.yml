name: Job Radar

on:
  schedule:
    # Каждые 30 минут с 07:00 до 22:00 по Москве (UTC+3).
    # Частота задаёт задержку ответа бота на команды: в среднем 15 минут.
    # Минута 17, а не 0: GitHub предупреждает о задержках в начале часа.
    - cron: '17,47 4-19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать вакансии в логе, без отправки в Telegram'
        type: boolean
        default: false

# Состояние коммитится обратно в репозиторий, поэтому нужна запись.
permissions:
  contents: write

# Параллельные запуски создали бы конфликт при коммите state.json.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Поиск вакансий и обработка команд
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Нужны только для отправки откликов: без них /apply вернёт понятную ошибку,
          # а поиск вакансий продолжит работать.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi

      # Коммитим даже после сбоя предыдущего шага: отклик мог уже уйти,
      # и без сохранения журнала он отправится повторно при следующем запуске.
      - name: Сохранить состояние
        if: always() && inputs.dry_run != true
        run: |
          if git diff --quiet -- state/state.json; then
            echo "Состояние не изменилось."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: обновление состояния job-radar [skip ci]"
          # Между запуском и коммитом состояние могло уехать: подтягиваем и повторяем.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Попытка $attempt не удалась, повтор..."
            sleep 5
          done
          exit 1
